name: Deploy Android to Google Play Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Play API authentication dependencies
        run: pip install google-auth==2.40.3 requests==2.32.4

      - name: Test release tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check Play and allocate unused versionCode
        id: play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/play_release.py preflight

      - name: Validate Android signing secret
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "ANDROID_KEYSTORE_BASE64 is not configured"
          exit 1

      - name: Prepare release properties
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          printf '\n' >> gradle.properties
          {
            echo "STORE_FILE=release.keystore"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> gradle.properties
          printf 'MAPS_API_KEY=%s\n' "${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release AAB
        run: |
          VERSION_CODE=${{ steps.play.outputs.version_code }}
          echo "Building versionCode $VERSION_CODE"
          ./gradlew bundleRelease -PversionCode="$VERSION_CODE" --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish bundle and bilingual store listing atomically
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: python scripts/play_release.py publish --bundle app/build/outputs/bundle/release/app-release.aab --code ${{ steps.play.outputs.version_code }}

      - name: Save verified Play submission result
        uses: actions/upload-artifact@v4
        with:
          name: play-release-result
          path: play-release-result.json

      - name: Clean signing material
        if: always()
        run: rm -f app/release.keystore local.properties gradle.properties
